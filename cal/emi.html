<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Loan Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f8fafc;
        }
        /* Style input range sliders nicely */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 9999px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #2563eb;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        
        <a href="../index.html" class="text-slate-500 hover:text-slate-900 transition mb-6 inline-flex items-center gap-2 text-sm font-medium">
            <i class="fa-solid fa-arrow-left"></i> Back to Calculators
        </a>

        <div class="mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">
                EMI Calculator
            </h1>
            <div class="w-12 h-[3px] bg-blue-600 mt-3 rounded-full"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between min-h-[420px] order-1 lg:order-2">
                
                <!-- Stats Header -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-2 border-b border-slate-100 pb-5 mb-5 text-center">
                    <div class="px-1">
                        <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">Monthly EMI</span>
                        <span class="text-sm sm:text-base md:text-lg font-bold text-blue-600 break-all" id="displayEmi">₹0</span>
                    </div>
                    <div class="border-y border-slate-100 sm:border-y-0 sm:border-x py-2 sm:py-0 px-1">
                        <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">Total Interest</span>
                        <span class="text-sm sm:text-base md:text-lg font-bold text-amber-500 break-all" id="displayInterest">₹0</span>
                    </div>
                    <div class="px-1">
                        <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">Total Payment</span>
                        <span class="text-sm sm:text-base md:text-lg font-extrabold text-slate-800 break-all" id="displayTotal">₹0</span>
                    </div>
                </div>

                <div class="w-full flex-grow relative min-h-[250px] max-h-[280px] flex items-center justify-center">
                    <canvas id="emiChart"></canvas>
                </div>

                <div class="flex flex-wrap justify-center gap-6 mt-6 w-full border-t border-slate-100 pt-4">
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 rounded bg-[#39e75f]"></div>
                        <span class="text-xs font-semibold text-slate-600">Principal Loan Amount</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-3 h-3 rounded bg-[#f59e0b]"></div>
                        <span class="text-xs font-semibold text-slate-600">Total Interest Payable</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6 order-2 lg:order-1">
                
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-slate-600">Loan Amount</label>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 max-w-[140px]">
                            <span class="text-slate-400 mr-1 text-sm">₹</span>
                            <input type="number" id="loanInput" value="500000" min="10000" max="50000000" step="10000" class="w-full bg-transparent outline-none text-right font-bold text-slate-900 text-sm">
                        </div>
                    </div>
                    <input type="range" id="loanSlider" min="10000" max="50000000" step="10000" value="500000">
                    <div class="flex justify-between text-[10px] text-slate-400 mt-1">
                        <span>₹10K</span>
                        <span>₹5Cr</span>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-slate-600">Interest Rate (p.a)</label>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 max-w-[100px]">
                            <input type="number" id="rateInput" value="8.5" min="1" max="30" step="0.1" class="w-full bg-transparent outline-none text-right font-bold text-slate-900 text-sm">
                            <span class="text-slate-400 ml-1 text-sm">%</span>
                        </div>
                    </div>
                    <input type="range" id="rateSlider" min="1" max="30" step="0.1" value="8.5">
                    <div class="flex justify-between text-[10px] text-slate-400 mt-1">
                        <span>1%</span>
                        <span>30%</span>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-slate-600">Loan Tenure</label>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 max-w-[110px]">
                            <input type="number" id="tenureInput" value="5" min="1" max="30" step="1" class="w-full bg-transparent outline-none text-right font-bold text-slate-900 text-sm">
                            <span class="text-slate-400 ml-1 text-sm">Yr</span>
                        </div>
                    </div>
                    <input type="range" id="tenureSlider" min="1" max="30" step="1" value="5">
                    <div class="flex justify-between text-[10px] text-slate-400 mt-1">
                        <span>1 Yr</span>
                        <span>30 Yr</span>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-400 font-medium tracking-wide bg-white mt-12">
        <p>&copy; 2026 Investment Calculators Hub.</p>
    </footer>

    <script>
        // Core Control DOM Elements
        const loanSlider = document.getElementById('loanSlider');
        const loanInput = document.getElementById('loanInput');
        const rateSlider = document.getElementById('rateSlider');
        const rateInput = document.getElementById('rateInput');
        const tenureSlider = document.getElementById('tenureSlider');
        const tenureInput = document.getElementById('tenureInput');

        const displayEmi = document.getElementById('displayEmi');
        const displayInterest = document.getElementById('displayInterest');
        const displayTotal = document.getElementById('displayTotal');

        // Formatter using Indian Standard Currency Format (INR)
        const formatINR = (value) => {
            return '₹' + Math.round(value).toLocaleString('en-IN');
        };

        // Chart Initialization (Doughnut Chart breaking down Principal vs Interest)
        const ctx = document.getElementById('emiChart').getContext('2d');
        let emiChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Principal Loan Amount', 'Total Interest Payable'],
                datasets: [
                    {
                        data: [0, 0],
                        backgroundColor: ['#39e75f', '#f59e0b'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '70%',
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return ` ${context.label}: ${formatINR(context.raw)}`;
                            }
                        }
                    }
                }
            }
        });

        // Core Formula Logic Calculation for EMI
        function calculateEMI() {
            const P = parseFloat(loanInput.value) || 0;
            const annualRate = parseFloat(rateInput.value) || 0;
            const years = parseInt(tenureInput.value) || 0;

            const r = (annualRate / 100) / 12; // Monthly interest rate
            const n = years * 12; // Total tenure in months

            let emi = 0;
            let totalAmount = 0;
            let totalInterest = 0;

            if (P > 0 && n > 0) {
                if (r > 0) {
                    emi = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                } else {
                    emi = P / n;
                }
                totalAmount = emi * n;
                totalInterest = Math.max(0, totalAmount - P);
            }

            // DOM Visual Elements Sync Insertion
            displayEmi.innerText = formatINR(emi);
            displayInterest.innerText = formatINR(totalInterest);
            displayTotal.innerText = formatINR(totalAmount);

            // Update Doughnut Chart
            emiChart.data.datasets[0].data = [Math.round(P), Math.round(totalInterest)];
            emiChart.update();
        }

        // Control Sync Linkage
        function syncControl(slider, input) {
            slider.addEventListener('input', () => { input.value = slider.value; calculateEMI(); });
            input.addEventListener('input', () => {
                if(input.value === '') return;
                let val = parseFloat(input.value);
                if(val < parseFloat(input.min)) val = parseFloat(input.min);
                if(val > parseFloat(input.max)) val = parseFloat(input.max);
                slider.value = val;
                calculateEMI();
            });
            input.addEventListener('blur', () => {
                if(input.value === '' || parseFloat(input.value) < parseFloat(input.min)) input.value = input.min;
                slider.value = input.value;
                calculateEMI();
            });
        }

        syncControl(loanSlider, loanInput);
        syncControl(rateSlider, rateInput);
        syncControl(tenureSlider, tenureInput);

        // Initial Calculation Trigger
        calculateEMI();
    </script>
</body>
</html>
