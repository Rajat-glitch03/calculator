<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f8fafc;
        }
        input[type="date"], input[type="datetime-local"] {
            font-family: 'DM Sans', sans-serif;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">
        
        <a href="../index.html" class="text-slate-500 hover:text-slate-900 transition mb-6 inline-flex items-center gap-2 text-sm font-medium">
            <i class="fa-solid fa-arrow-left"></i> Back to Calculators
        </a>

        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">
                    Age Calculator
                </h1>
                <div class="w-12 h-[3px] bg-blue-600 mt-3 rounded-full"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
            
            <!-- Output Display Panel -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between min-h-[460px] order-1 lg:order-2">
                
                <!-- Main Age Stats Header -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-2 border-b border-slate-100 pb-5 mb-4 text-center">
                    <div class="px-1">
                        <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">Years</span>
                        <span class="text-sm sm:text-base md:text-lg font-bold text-slate-800 break-all" id="displayYears">0</span>
                    </div>
                    <div class="border-y border-slate-100 sm:border-y-0 sm:border-x py-2 sm:py-0 px-1">
                        <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">Months</span>
                        <span class="text-sm sm:text-base md:text-lg font-bold text-emerald-600 break-all" id="displayMonths">0</span>
                    </div>
                    <div class="px-1">
                        <span class="block text-[10px] text-slate-400 uppercase tracking-wider font-bold mb-1">Days</span>
                        <span class="text-sm sm:text-base md:text-lg font-extrabold text-blue-600 break-all" id="displayDays">0</span>
                    </div>
                </div>

                <!-- Secondary Summary Breakdown Grid (2-Column Pairs Grid Pattern) -->
                <div class="w-full flex-grow flex flex-col justify-center space-y-2 my-1">
                    <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider text-center mb-1">Total Lifetime Metrics</h2>
                    
                    <div class="grid grid-cols-2 gap-2.5">
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                            <span class="block text-[10px] text-slate-400 font-semibold mb-0.5">Total Months</span>
                            <span class="text-xs sm:text-sm font-bold text-slate-800" id="totalMonths">0</span>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                            <span class="block text-[10px] text-slate-400 font-semibold mb-0.5">Total Weeks</span>
                            <span class="text-xs sm:text-sm font-bold text-slate-800" id="totalWeeks">0</span>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                            <span class="block text-[10px] text-slate-400 font-semibold mb-0.5">Total Days</span>
                            <span class="text-xs sm:text-sm font-bold text-slate-800" id="totalDays">0</span>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                            <span class="block text-[10px] text-slate-400 font-semibold mb-0.5">Total Hours</span>
                            <span class="text-xs sm:text-sm font-bold text-slate-800" id="totalHours">0</span>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                            <span class="block text-[10px] text-slate-400 font-semibold mb-0.5">Total Minutes</span>
                            <span class="text-xs sm:text-sm font-bold text-amber-600" id="totalMinutes">0</span>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-center">
                            <span class="block text-[10px] text-slate-400 font-semibold mb-0.5">Total Seconds</span>
                            <span class="text-xs sm:text-sm font-extrabold text-blue-600" id="totalSeconds">0</span>
                        </div>
                    </div>
                </div>

                <!-- Footer Summary Badge -->
                <div class="flex flex-wrap justify-center gap-6 mt-3 w-full border-t border-slate-100 pt-3">
                    <div class="flex items-center space-x-2">
                        <div class="w-2.5 h-2.5 rounded bg-[#2563eb]"></div>
                        <span class="text-xs font-semibold text-slate-600" id="nextBirthdayText">Next Birthday in: --</span>
                    </div>
                </div>
            </div>

            <!-- Input Controls Panel -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6 order-2 lg:order-1">
                
                <!-- Date & Time of Birth Input -->
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">Date & Time of Birth</label>
                    <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5">
                        <i class="fa-regular fa-calendar-plus text-slate-400 mr-2 text-sm"></i>
                        <input type="datetime-local" id="dobInput" class="w-full bg-transparent outline-none font-bold text-slate-900 text-sm">
                    </div>
                </div>

                <!-- Target Date / Age At Date Input -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-slate-600">Age at the Date of</label>
                        <button id="resetLiveBtn" class="text-[10px] text-blue-600 font-bold hover:underline hidden">Use Real-Time Now</button>
                    </div>
                    <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5">
                        <i class="fa-regular fa-clock text-slate-400 mr-2 text-sm"></i>
                        <input type="datetime-local" id="targetDateInput" class="w-full bg-transparent outline-none font-bold text-slate-900 text-sm">
                    </div>
                </div>

                <!-- Error Display -->
                <div id="errorMessage" class="hidden text-xs text-red-500 font-semibold bg-red-50 p-3 rounded-lg border border-red-100">
                    Target date/time must be after your Date of Birth.
                </div>

            </div>

        </div>
    </main>

    <footer class="border-t border-slate-200 py-6 text-center text-xs text-slate-400 font-medium tracking-wide bg-white mt-12">
        <p>&copy; 2026 Investment Calculators Hub.</p>
    </footer>

    <script>
        // DOM Elements
        const dobInput = document.getElementById('dobInput');
        const targetDateInput = document.getElementById('targetDateInput');
        const errorMessage = document.getElementById('errorMessage');
        const resetLiveBtn = document.getElementById('resetLiveBtn');

        const displayYears = document.getElementById('displayYears');
        const displayMonths = document.getElementById('displayMonths');
        const displayDays = document.getElementById('displayDays');

        const totalMonths = document.getElementById('totalMonths');
        const totalWeeks = document.getElementById('totalWeeks');
        const totalDays = document.getElementById('totalDays');
        const totalHours = document.getElementById('totalHours');
        const totalMinutes = document.getElementById('totalMinutes');
        const totalSeconds = document.getElementById('totalSeconds');
        const nextBirthdayText = document.getElementById('nextBirthdayText');

        let isLiveMode = true;

        // Helper to format Date into HTML datetime-local input string (YYYY-MM-DDTHH:mm)
        function formatDatetimeLocal(date) {
            const pad = (num) => String(num).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
        }

        // Set Default Inputs
        const now = new Date();
        const defaultDob = new Date('2000-01-01T00:00');
        dobInput.value = formatDatetimeLocal(defaultDob);
        targetDateInput.value = formatDatetimeLocal(now);

        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        function calculateAge() {
            if (!dobInput.value) return;

            const dob = new Date(dobInput.value);
            const target = isLiveMode ? new Date() : new Date(targetDateInput.value);

            if (isLiveMode) {
                targetDateInput.value = formatDatetimeLocal(target);
            }

            if (target < dob) {
                errorMessage.classList.remove('hidden');
                displayYears.innerText = '0';
                displayMonths.innerText = '0';
                displayDays.innerText = '0';
                totalMonths.innerText = '0';
                totalWeeks.innerText = '0';
                totalDays.innerText = '0';
                totalHours.innerText = '0';
                totalMinutes.innerText = '0';
                totalSeconds.innerText = '0';
                nextBirthdayText.innerText = 'Next Birthday in: --';
                return;
            } else {
                errorMessage.classList.add('hidden');
            }

            let birthYear = dob.getFullYear();
            let birthMonth = dob.getMonth();
            let birthDay = dob.getDate();

            let targetYear = target.getFullYear();
            let targetMonth = target.getMonth();
            let targetDay = target.getDate();

            // 1. Calculate Primary Age (Years, Months, Days)
            let calculatedDays = targetDay - birthDay;
            if (calculatedDays < 0) {
                targetMonth--;
                if (targetMonth < 0) {
                    targetMonth = 11;
                    targetYear--;
                }
                const daysInPrevMonth = getDaysInMonth(targetYear, targetMonth);
                calculatedDays += daysInPrevMonth;
            }

            let calculatedMonths = targetMonth - birthMonth;
            if (calculatedMonths < 0) {
                calculatedMonths += 12;
                targetYear--;
            }

            let calculatedYears = targetYear - birthYear;

            // 2. Calculate Secondary Live Breakdown Metrics
            const diffMs = Math.abs(target - dob);
            const diffSeconds = Math.floor(diffMs / 1000);
            const diffMinutes = Math.floor(diffSeconds / 60);
            const diffHours = Math.floor(diffMinutes / 60);
            const diffDays = Math.floor(diffHours / 24);
            const diffWeeks = (diffDays / 7).toFixed(1);
            const diffTotalMonths = (calculatedYears * 12) + calculatedMonths;

            // 3. Calculate Next Birthday Countdown
            let nextBirthday = new Date(target.getFullYear(), birthMonth, birthDay);
            if (nextBirthday < target) {
                nextBirthday.setFullYear(target.getFullYear() + 1);
            }
            const nextBdayDiffDays = Math.ceil((nextBirthday - target) / (1000 * 60 * 60 * 24));
            const nextBdayMonths = Math.floor(nextBdayDiffDays / 30.4375);
            const nextBdayDays = Math.round(nextBdayDiffDays % 30.4375);

            // Update DOM Elements
            displayYears.innerText = calculatedYears;
            displayMonths.innerText = calculatedMonths;
            displayDays.innerText = calculatedDays;

            totalMonths.innerText = diffTotalMonths.toLocaleString('en-IN');
            totalWeeks.innerText = diffWeeks;
            totalDays.innerText = diffDays.toLocaleString('en-IN');
            totalHours.innerText = diffHours.toLocaleString('en-IN');
            totalMinutes.innerText = diffMinutes.toLocaleString('en-IN');
            totalSeconds.innerText = diffSeconds.toLocaleString('en-IN');

            if (nextBdayDiffDays === 0 || nextBdayDiffDays === 365) {
                nextBirthdayText.innerText = "🎉 Happy Birthday Today!";
            } else {
                nextBirthdayText.innerText = `Next Birthday in: ${nextBdayMonths}m ${nextBdayDays}d`;
            }
        }

        // Live Clock Interval (1 second updates)
        setInterval(() => {
            if (isLiveMode) {
                calculateAge();
            }
        }, 1000);

        // Event Listeners
        dobInput.addEventListener('change', calculateAge);
        
        targetDateInput.addEventListener('change', () => {
            isLiveMode = false;
            resetLiveBtn.classList.remove('hidden');
            calculateAge();
        });

        resetLiveBtn.addEventListener('click', () => {
            isLiveMode = true;
            resetLiveBtn.classList.add('hidden');
            calculateAge();
        });

        // Initial Trigger
        calculateAge();
    </script>
</body>
</html>
